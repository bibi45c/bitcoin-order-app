name: "sast-scan"

on:
  push:
    branches: [githubcicd]

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm ci --force

      - name: Download OWASP Dependency-Check
        run: |
          wget https://github.com/dependency-check/DependencyCheck/releases/download/v12.2.2/dependency-check-12.2.2-release.zip
          unzip -q dependency-check-12.2.2-release.zip -d $HOME/dependency-check

      - name: Check NVD API access
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "$NVD_API_KEY"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apiKey: $NVD_API_KEY" \
            "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2021-44228")
          test "$STATUS" = "200"

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x $HOME/dependency-check/dependency-check/bin/dependency-check.sh
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --project "bitcoin" \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdApiDelay 3500 \
            --nvdMaxRetryCount 20 \
            --nvdApiResultsPerPage 1000 \
            --out . \
            --scan . \
            --disableOssIndex

      - name: Archive SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ./dependency-check-report.html